aid: getsetup
name: GetSetup
description: 'GetSetUp is a consumer education platform delivering live, interactive online
  classes designed specifically for older adults. Learners join expert-led sessions to build
  digital skills, stay physically and mentally active, pursue hobbies, and connect with a
  global community of peers. The catalog spans technology how-tos, health and wellness,
  finance, creativity, and social classes, offered in multiple languages across regions.
  GetSetUp partners with health plans, employers, libraries, and government programs to
  make classes accessible. Backed by Cowboy Ventures, it operates a business-to-consumer
  learning experience rather than a public developer API; this profile tracks its public
  web surface for the API Evangelist network.'
